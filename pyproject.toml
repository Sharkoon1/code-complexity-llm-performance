[project]
name = "projekt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13" 
dependencies = [
    "accelerate>=1.13.0",
    "datasets>=4.8.5",
    "gitpython>=3.1.50",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "openai>=2.38.0",
    "pandas>=3.0.3",
    "pingouin>=0.6.1",
    "python-dotenv>=1.2.2",
    "radon>=6.0.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tiktoken>=0.13.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "unidiff>=0.7.5",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pytest>=9.0.3",
    "pyzmq>=26",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
